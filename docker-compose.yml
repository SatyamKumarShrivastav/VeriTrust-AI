version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: veritrust_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Kri&Satya$$19@sql}
      MYSQL_DATABASE: veritrust_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veritrust_backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-Kri&Satya$$19@sql}
      - DB_NAME=veritrust_ai
      - SECRET_KEY=${SECRET_KEY:-veritrust-ai-production-secret-key-change-32chars}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./keys:/app/keys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veritrust_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:

